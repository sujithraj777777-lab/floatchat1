[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy /api/* to backend server
[[redirects]]
  from = "/api/*"
  to = "https://your-backend-api.onrender.com/:splat"
  status = 200
  force = true

# Single Page Application (SPA) client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
